[project]
name = "velocista-sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AlessoDev", email = "aless.85@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "jsonschema>=4.26.0",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
velocista-sim = "velocista_sim:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "websockets>=17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: prueba de tiempo real, lenta",
]
